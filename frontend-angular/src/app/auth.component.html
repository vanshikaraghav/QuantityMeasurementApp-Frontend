<div class="auth-container">
  <div class="auth-header">
    <h1>Quantity Measurement</h1>
    <p>Login or Register to continue</p>
  </div>

  <div class="auth-body">
    <div *ngIf="!isRegister">
      <div class="error-msg" *ngIf="loginError">{{ loginError }}</div>
      <h2>Sign In</h2>
      <form (ngSubmit)="handleLoginSubmit()">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" [(ngModel)]="loginEmail" name="loginEmail" required placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" [(ngModel)]="loginPassword" name="loginPassword" required placeholder="Enter password" />
        </div>
        <button type="submit" class="submit-btn" [disabled]="isSubmitting">Sign In</button>
      </form>

      <div class="toggle-section">
        <span class="toggle-text">Don't have an account?</span>
        <button class="toggle-btn" type="button" (click)="toggleSection()">Register here</button>
      </div>
    </div>

    <div *ngIf="isRegister">
      <div class="error-msg" *ngIf="registerError">{{ registerError }}</div>
      <h2>Create Account</h2>
      <form (ngSubmit)="handleRegisterSubmit()">
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input id="registerName" type="text" [(ngModel)]="registerName" name="registerName" required placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" [(ngModel)]="registerEmail" name="registerEmail" required placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" [(ngModel)]="registerPassword" name="registerPassword" required placeholder="Create password" />
        </div>
        <button type="submit" class="submit-btn" [disabled]="isSubmitting">Register</button>
      </form>

      <div class="toggle-section">
        <span class="toggle-text">Already have an account?</span>
        <button class="toggle-btn" type="button" (click)="toggleSection()">Sign in here</button>
      </div>
    </div>

    <div class="divider">or</div>

    <div class="google-btn-container">
      <div #googleSignInContainer></div>
    </div>

    <div *ngIf="googleError" class="error-msg">{{ googleError }}</div>
  </div>
</div>
