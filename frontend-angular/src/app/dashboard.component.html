<main class="app-shell">
  <section class="panel">
    <header class="panel-header">
      <div class="header-top">
        <h1>Welcome To Quantity Measurement</h1>
        <div class="user-section">
          <span *ngIf="isLoggedIn" class="user-name">{{ userName }}</span>
          <div class="auth-buttons">
            <button class="auth-link-btn" *ngIf="!isLoggedIn" type="button" (click)="goToAuth()">Login / Signup</button>
            <button class="danger-btn" *ngIf="isLoggedIn" type="button" (click)="logout()">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <div class="panel-body">
      <section class="block">
        <p class="block-label">Choose Type</p>
        <div class="type-grid" role="tablist" aria-label="Measurement type">
          <button
            type="button"
            class="type-card"
            *ngFor="let type of types"
            [class.active]="currentType === type.key"
            [attr.aria-selected]="currentType === type.key"
            (click)="selectType(type.key)">
            <span class="type-icon">{{ type.icon }}</span>
            <span>{{ type.label }}</span>
          </button>
        </div>
      </section>

      <section class="block">
        <p class="block-label">Choose Action</p>
        <div class="action-tabs" role="tablist" aria-label="Action mode">
          <button
            type="button"
            class="action-tab"
            *ngFor="let action of actions"
            [class.active]="currentAction === action.key"
            [attr.aria-selected]="currentAction === action.key"
            (click)="selectAction(action.key)">
            {{ action.label }}
          </button>
        </div>
      </section>

      <section class="mode-section" *ngIf="currentAction === 'comparison'">
        <div class="dual-input-row">
          <div class="input-card">
            <label for="comparisonFromValue">From</label>
            <input id="comparisonFromValue" type="number" step="any" [(ngModel)]="comparisonFromValue" (ngModelChange)="updateComparison()" />
            <select [(ngModel)]="comparisonFromUnit" (ngModelChange)="updateComparison()">
              <option *ngFor="let unit of unitNames" [value]="unit">{{ unit }}</option>
            </select>
          </div>

          <div class="input-card">
            <label for="comparisonToValue">To</label>
            <output id="comparisonToValue" class="value-output">{{ comparisonToValue }}</output>
            <select [(ngModel)]="comparisonToUnit" (ngModelChange)="updateComparison()">
              <option *ngFor="let unit of unitNames" [value]="unit">{{ unit }}</option>
            </select>
          </div>
        </div>
      </section>

      <section class="mode-section" *ngIf="currentAction === 'conversion'">
        <div class="single-result-layout">
          <div class="input-card full-width">
            <label for="conversionInput">Value</label>
            <input id="conversionInput" type="number" step="any" [(ngModel)]="conversionInput" (ngModelChange)="updateConversion()" />
            <select [(ngModel)]="conversionFromUnit" (ngModelChange)="updateConversion()">
              <option *ngFor="let unit of unitNames" [value]="unit">{{ unit }}</option>
            </select>
          </div>

          <div class="result-card">
            <p>Converted Value</p>
            <h2>{{ conversionResult }}</h2>
            <select [(ngModel)]="conversionToUnit" (ngModelChange)="updateConversion()">
              <option *ngFor="let unit of unitNames" [value]="unit">{{ unit }}</option>
            </select>
          </div>
        </div>
      </section>

      <section class="mode-section" *ngIf="currentAction === 'arithmetic'">
        <div class="dual-input-row arithmetic-row">
          <div class="input-card">
            <label for="arithValue1">Value 1</label>
            <input id="arithValue1" type="number" step="any" [(ngModel)]="arithValue1" (ngModelChange)="updateArithmetic()" />
            <select [(ngModel)]="arithUnit1" (ngModelChange)="updateArithmetic()">
              <option *ngFor="let unit of unitNames" [value]="unit">{{ unit }}</option>
            </select>
          </div>

          <div class="operator-card">
            <select [(ngModel)]="arithOperator" (ngModelChange)="updateArithmetic()" aria-label="Arithmetic operator">
              <option value="+">+</option>
              <option value="-">-</option>
              <option value="/">/</option>
            </select>
          </div>

          <div class="input-card">
            <label for="arithValue2">Value 2</label>
            <input id="arithValue2" type="number" step="any" [(ngModel)]="arithValue2" (ngModelChange)="updateArithmetic()" />
            <select [(ngModel)]="arithUnit2" (ngModelChange)="updateArithmetic()">
              <option *ngFor="let unit of unitNames" [value]="unit">{{ unit }}</option>
            </select>
          </div>
        </div>

        <div class="result-card result-inline">
          <p>Result</p>
          <h2>{{ arithResult }}</h2>
          <select [(ngModel)]="arithResultUnit" (ngModelChange)="updateArithmetic()">
            <option *ngFor="let unit of unitNames" [value]="unit">{{ unit }}</option>
          </select>
        </div>
      </section>

      <section class="mode-section" *ngIf="currentAction === 'history'">
        <div *ngIf="!isLoggedIn" class="history-login-hint">
          <p>To view history, please log in or sign up.</p>
          <button class="auth-link-btn" type="button" (click)="goToAuth()">Go To Login</button>
        </div>

        <div *ngIf="isLoggedIn && history.length === 0" class="history-empty">
          No operation history yet.
        </div>

        <ul *ngIf="isLoggedIn && history.length > 0" class="history-list">
          <li *ngFor="let entry of history">{{ entry }}</li>
        </ul>
      </section>
    </div>
  </section>
</main>
